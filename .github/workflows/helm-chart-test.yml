name: Helm Chart Tests

on:
  push:
    branches: [ main, develop, feat/* ]
    paths:
      - 'helm-chart/**'
      - '.github/workflows/helm-chart-test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'helm-chart/**'
      - '.github/workflows/helm-chart-test.yml'

env:
  HELM_VERSION: v4.0.0
  KUBECTL_VERSION: v1.34.0
  KIND_VERSION: v0.30.0

jobs:
  lint:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Setup Helm repositories
        uses: ./.github/actions/setup-helm-repos

      - name: Lint Helm chart
        run: |
          cd helm-chart/stac-fastapi
          helm dependency update
          helm lint .

  test-matrix:
    name: Test Chart
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        backend: [opensearch]
        kubernetes-version: [v1.33.1]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Set up Kind
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: ${{ env.KIND_VERSION }}
          node_image: kindest/node:${{ matrix.kubernetes-version }}
          cluster_name: stac-fastapi-${{ matrix.kubernetes-version }}
          config: .github/kind/multi-node.yaml

      - name: Setup Helm repositories
        uses: ./.github/actions/setup-helm-repos

      - name: Run matrix tests
        env:
          BACKEND: ${{ matrix.backend }}
          MATRIX_MODE: true
        run: |
          chmod +x ./helm-chart/test-chart.sh
          ./helm-chart/test-chart.sh -m -b ${{ matrix.backend }} ci

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-report-${{ matrix.backend }}-k8s-${{ matrix.kubernetes-version }}
          path: test-report-*.json

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Setup Helm repositories
        uses: ./.github/actions/setup-helm-repos

      - name: Run Checkov security scan
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # master
        with:
          directory: helm-chart/
          framework: kubernetes
          output_format: sarif
          output_file_path: reports/results.sarif

      - name: Upload Checkov results
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: reports/results.sarif
